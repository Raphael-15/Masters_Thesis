name: Run example notebook (smoke test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute example notebook
        run: |
          jupyter nbconvert --ExecutePreprocessor.kernel_name=python3 --to notebook --execute notebooks/example_end_to_end.ipynb --output executed_example.ipynb --ExecutePreprocessor.timeout=600

      - name: List generated files
        run: ls -la
